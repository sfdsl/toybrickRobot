# ============================================================
# nav2_collision_monitor —— 硬安全层（替代自研"前向 ±30° 扇区减速/急停"）
#
# 链路：nav2 controller → cmd_vel_raw → velocity_smoother → cmd_vel_nav
#       → 【本节点】→ cmd_vel → base_driver
#
# 判据（对齐自研 N3 安全层；2026-09-22 撞人事故后上调）：
#   前方 0.16~1.00 m、左右 ±0.22 m 区域出现障碍 → 减速到 40%
#   前方 0.16~0.45 m、左右 ±0.15 m 区域出现障碍 → 立即停车
#
# 模板：/opt/ros/humble/share/nav2_collision_monitor/params/collision_monitor_params.yaml
# ============================================================
collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_nav"
    cmd_vel_out_topic: "cmd_vel"
    transform_tolerance: 0.5
    source_timeout: 1.0            # 雷达 ~6Hz，1s 无数据即告警（默认 5.0 太长）
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["PolygonSlow", "PolygonStop"]

    # 减速区：前方 0.30 m 内、横向 ±20 cm
    #   ⚠ P14：0.16~1.00 m 的大慢区把绕行转向指令磨进底盘死区（ω -0.126→-0.03）→ 僵死。
    #   ⚠ P17：0.45 m 慢区实测仍会让 DWB 在箱前 15s 只挪 0.5m（Failed to make progress）。
    #   收到 0.30 m、ratio 0.9：贴障时几乎不磨速（0.20×0.9=0.18，实测底盘 0.18 档实际
    #   ~0.17 m/s），提前减速交给 DWB 代价坡度 + smoother；0.20 m 急停区仍是兜底。
    PolygonSlow:
      type: "polygon"
      points: [0.16, 0.20, 0.30, 0.20, 0.30, -0.20, 0.16, -0.20]
      action_type: "slowdown"
      max_points: 3
      slowdown_ratio: 0.9
      visualize: True
      polygon_pub_topic: "polygon_slowdown"
      enabled: True

    # 急停区：前方 28 cm 内、横向 ±12 cm
    #   ⚠ P7 实测：原来 0.45 m 太大，**把绕行的路堵死了**——DWB 的 ObstacleFootprintCritic
    #   要到「车体半径0.12 + 箱半宽0.15 ≈ 0.27 m」才判定"直行不可行"，而 monitor 在
    #   0.45 m 就急停，车还没等到 DWB 否决直行就被按死（实测 2.01,-0.15 处 y 刚偏 0.05 m 即停）。
    #   安全层必须**比 DWB 的决策边界更靠内**，才能既保住兜底、又留给它绕行空间。
    #   0.28 m：车速 0.15 m/s ≈ 1.9 s 行程，刹得住；减速区仍保持 1.0 m 提前预警。
    PolygonStop:
      type: "polygon"
      # 0.28 → 0.20：DWB 的 ObstacleFootprintCritic 否决边界在 0.24m（车体 0.12 + 内切 0.12），
      # 急停区必须**比它更靠内**，DWB 才有"直行被否决 → 改选绕行"的决策窗口
      # （0.24 否决 vs 0.20 停 = 4cm，0.15 m/s 下约 2.7 个控制周期）。
      # 横向同步收窄到 ±0.10，便于绕行时"滑出"急停区。
      # 安全余量：0.20 m ≈ 1.3 秒行程，减速区仍保持 1.0 m 提前预警。
      points: [0.12, 0.10, 0.20, 0.10, 0.20, -0.10, 0.12, -0.10]
      action_type: "stop"
      max_points: 3
      visualize: True
      polygon_pub_topic: "polygon_stop"
      enabled: True

    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      enabled: True

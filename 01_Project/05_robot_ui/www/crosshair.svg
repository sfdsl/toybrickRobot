<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- 白色描边：让光标在黑色障碍、灰色未知区上也看得见 -->
  <g stroke="#ffffff" stroke-width="4.5" stroke-linecap="round">
    <line x1="16" y1="1.5" x2="16" y2="11"/>
    <line x1="16" y1="21" x2="16" y2="30.5"/>
    <line x1="1.5" y1="16" x2="11" y2="16"/>
    <line x1="21" y1="16" x2="30.5" y2="16"/>
  </g>
  <!-- 主色（青）：白底/浅色地图上靠这个辨认；改颜色就改这里的 #00d9ff -->
  <g stroke="#00d9ff" stroke-width="2" stroke-linecap="round">
    <line x1="16" y1="1.5" x2="16" y2="11"/>
    <line x1="16" y1="21" x2="16" y2="30.5"/>
    <line x1="1.5" y1="16" x2="11" y2="16"/>
    <line x1="21" y1="16" x2="30.5" y2="16"/>
  </g>
  <!-- 中心点：取点精度靠它 -->
  <circle cx="16" cy="16" r="2.6" fill="#ffffff"/>
  <circle cx="16" cy="16" r="1.4" fill="#00d9ff"/>
</svg>
